[project]
name = "travel-env"
version = "0.1.0"
description = "An RL environment for an AI travel agent"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2",
    "pydantic>=2.9",
    "numpy>=2.0",
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
train = ["sb3-contrib>=2.4", "stable-baselines3>=2.4", "tensorboard"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel_env", "eval"]
